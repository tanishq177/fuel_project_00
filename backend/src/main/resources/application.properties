# ===================================================================
# Application Properties: Customer Support & Helpdesk Platform
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=customer-support-helpdesk

# ===================================================================
# In-Memory H2 Database Configuration (Ready to run instantly!)
# No MySQL installation required.
# ===================================================================
spring.datasource.url=jdbc:h2:mem:helpdesk_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show error details in API response
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# MySQL Database Configuration
# (Uncomment below if you have MySQL Server / XAMPP running on port 3306)
